name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q
      - run: python -m storelistingkit selftest

  evals:
    name: Extraction evals (real repos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/cache@v4
        with:
          path: evals/.cache
          key: eval-repos-${{ hashFiles('evals/cases.json') }}
      - run: python evals/run_evals.py --min-score 0.95 --out eval-results.md
      - run: cat eval-results.md >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pip-audit --skip-editable

  windows-build:
    name: Windows exe + installer
    needs: [test]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[build]"
      - name: PyInstaller (folder build for the installer)
        working-directory: packaging
        run: python -m PyInstaller --noconfirm --distpath ..\dist --workpath ..\build storelistingkit.spec
      - name: PyInstaller (portable single exe)
        working-directory: packaging
        env:
          SLK_ONEFILE: "1"
        run: python -m PyInstaller --noconfirm --distpath ..\dist --workpath ..\build\onefile storelistingkit.spec
      - name: Smoke test the built exes
        shell: pwsh
        run: |
          .\dist\StoreListingKit.exe selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\StoreListingKit\StoreListingKit.exe selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (python -c "import storelistingkit; print(storelistingkit.__version__)")
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Test silent install + installed exe
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\StoreListingKit-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\StoreListingKit\StoreListingKit.exe"
          & $exe selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: StoreListingKit-windows
          path: |
            dist/StoreListingKit.exe
            dist/StoreListingKit-Setup-*.exe
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/StoreListingKit.exe
            dist/StoreListingKit-Setup-*.exe
